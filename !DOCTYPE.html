<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verificador de Certificados</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2b5b 0%, #1a4a9e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 24px;
      color: white;
    }
    .logo-area h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 1px; }
    .logo-area p  { font-size: 0.9rem; opacity: 0.8; margin-top: 4px; }

    .card {
      background: white;
      border-radius: 20px;
      padding: 36px 32px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f2b5b;
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: 0.88rem;
      color: #6b7280;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      color: #111827;
      text-transform: uppercase;
    }
    input:focus { border-color: #1a4a9e; }
    input::placeholder { text-transform: none; color: #9ca3af; font-size: 0.9rem; }

    .hint {
      font-size: 0.78rem;
      color: #9ca3af;
      margin-top: 5px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      background: linear-gradient(135deg, #1a4a9e, #0f2b5b);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover:not(:disabled) { opacity: 0.92; transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Resultado */
    #resultado { margin-top: 24px; display: none; }

    .res-valido {
      border: 2px solid #10b981;
      border-radius: 14px;
      overflow: hidden;
    }
    .res-invalido {
      border: 2px solid #ef4444;
      border-radius: 14px;
      overflow: hidden;
    }

    .res-header {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .res-header-valido   { background: #10b981; color: white; }
    .res-header-invalido { background: #ef4444; color: white; }

    .res-icon { font-size: 1.3rem; }

    .res-body { padding: 18px 20px; background: #f9fafb; }

    .res-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .res-item { display: flex; flex-direction: column; gap: 2px; }
    .res-item.full { grid-column: 1 / -1; }
    .res-key {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6b7280;
    }
    .res-val {
      font-size: 0.95rem;
      font-weight: 600;
      color: #111827;
    }

    .estado-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .estado-valido   { background: #d1fae5; color: #065f46; }
    .estado-invalido { background: #fee2e2; color: #991b1b; }

    .res-invalido-body {
      padding: 18px 20px;
      background: #fff5f5;
      color: #7f1d1d;
      font-size: 0.9rem;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 0.78rem;
    }
  </style>
</head>
<body>

  <div class="logo-area">
    <h1>🏅 CERTIFICADOS DIGITALES</h1>
    <p>Sistema de Verificación de Autenticidad</p>
  </div>

  <div class="card">
    <div class="card-title">Verificar Certificado</div>
    <div class="card-sub">Ingresa el código del certificado o el número de DNI del participante.</div>

    <label>Código o DNI</label>
    <input
      type="text"
      id="busqueda"
      placeholder="Ej: LCT-ALT-2026-101 o 71345955"
      onkeydown="if(event.key==='Enter') verificar()"
      autocomplete="off"
      spellcheck="false"
    />
    <div class="hint">Puedes buscar por código de certificado o por número de DNI.</div>

    <button id="btn" onclick="verificar()">🔍 VERIFICAR CERTIFICADO</button>

    <div id="resultado"></div>
  </div>

  <div class="footer">Los certificados son emitidos y verificados en tiempo real.</div>

<script>
  // ↓ REEMPLAZA ESTO CON TU URL DEL WEB APP
  const API = "https://script.google.com/macros/s/AKfycbxoIMP9rQeLNV67DqYXuUiyyANzboHfM3d-lC6ArQPgFDYGx38_KUGK0qF_nJs-078/exec";

  async function verificar() {
    const valor     = document.getElementById("busqueda").value.trim();
    const resultado = document.getElementById("resultado");
    const btn       = document.getElementById("btn");

    if (!valor) {
      document.getElementById("busqueda").focus();
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Verificando...';
    resultado.style.display = "none";

    try {
      const res  = await fetch(`${API}?codigo=${encodeURIComponent(valor)}`);
      const data = await res.json();

      if (data.encontrado) {
        const estadoClass = data.estado.toString().toLowerCase().includes("válid")
          ? "estado-valido" : "estado-invalido";

        resultado.innerHTML = `
          <div class="res-valido">
            <div class="res-header res-header-valido">
              <span class="res-icon">✅</span>
              CERTIFICADO VERIFICADO Y AUTÉNTICO
            </div>
            <div class="res-body">
              <div class="res-grid">
                <div class="res-item full">
                  <span class="res-key">Participante</span>
                  <span class="res-val">${data.participante}</span>
                </div>
                <div class="res-item">
                  <span class="res-key">Código</span>
                  <span class="res-val">${data.codigo}</span>
                </div>
                <div class="res-item">
                  <span class="res-key">DNI</span>
                  <span class="res-val">${data.dni}</span>
                </div>
                <div class="res-item full">
                  <span class="res-key">Curso</span>
                  <span class="res-val">${data.curso}</span>
                </div>
                <div class="res-item">
                  <span class="res-key">Fecha</span>
                  <span class="res-val">${data.fecha}</span>
                </div>
                <div class="res-item">
                  <span class="res-key">Horas</span>
                  <span class="res-val">${data.horas} horas</span>
                </div>
                <div class="res-item">
                  <span class="res-key">Estado</span>
                  <span class="res-val">
                    <span class="estado-badge ${estadoClass}">${data.estado}</span>
                  </span>
                </div>
              </div>
            </div>
          </div>`;
      } else {
        resultado.innerHTML = `
          <div class="res-invalido">
            <div class="res-header res-header-invalido">
              <span class="res-icon">❌</span>
              CERTIFICADO NO ENCONTRADO
            </div>
            <div class="res-invalido-body">
              El código o DNI <strong>"${valor}"</strong> no está registrado en nuestra base de datos.
              Verifica que los datos sean correctos o comunícate con la institución.
            </div>
          </div>`;
      }

    } catch (err) {
      resultado.innerHTML = `
        <div class="res-invalido">
          <div class="res-header res-header-invalido">
            <span class="res-icon">⚠️</span> Error de Conexión
          </div>
          <div class="res-invalido-body">
            No se pudo conectar al servidor. Intenta nuevamente en unos segundos.
          </div>
        </div>`;
    }

    resultado.style.display = "block";
    btn.disabled  = false;
    btn.innerHTML = "🔍 VERIFICAR CERTIFICADO";
  }
</script>
</body>
</html>
